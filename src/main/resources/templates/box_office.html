<html layout:decorate="~{layout}">
<div class="container py-5" layout:fragment="content">
	
	<div class="mb-5">
		<h1 class="fw-bold border-bottom mb-3 pb-3">일별 영화 박스 오피스</h1>
	</div>
	
	<table class="table table-striped table-hover">
		    <thead>
		        <tr>
		            <th scope="col">순위</th>
		            <th scope="col">제목</th>
		            <th scope="col">포스터</th>
		            <th scope="col">개봉일</th>
		            <th scope="col">누적 관객 수</th>
		            <th scope="col">누적 매출액</th>
		        </tr>
		    </thead>
		    <tbody class="table-group-divider">
		        <tr th:each="question, loop: ${pagination}">
		            <td th:text="${pagination.getTotalElements-(pagination.number*pagination.size)-loop.index}"></td>
		            <td><a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a><span class="badge bg-primary ms-2" th:if="${#lists.size(question.answerList)>0}" th:text="${#lists.size(question.answerList)}">댓글</span></td>
					<td th:text="${question.author?.username}"></td>
		            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd hh:mm:ss')}"></td>
		        </tr>
		    </tbody>
		</table>
</div>

<script layout:fragment="script">
	$(function(){
		console.log("아자스!!")
		
		const getDate=()=>{
			const date=new Date();
			let y=date.getFullYear();
			let m=date.getMonth()+1;
			let d=date.getDate()-1;
			
			return `${String(y).padStart(2, "0")}${String(m).padStart(2, "0")}${String(d).padStart(2, "0")}`;
		}
		
		const getJSON=(targetDt)=>{
			$.ajax({
				type: "get",
				url: "/api/boxoffice",
				data: {targetDt: targetDt},
				dataType: "json",
				success: (datas)=>{
					console.log("ajax success");
					console.log("data: ", datas);
					const list=datas.boxOfficeResult.dailyBoxOfficeList;
					console.log("list: ", list);
					$("tbody").html(
						list.map(data=>`
						<tr>
				            <td>${data.rank}</td>
				            <td>${data.movieNm}</td>
				            <td>포스터</td>
				            <td>${data.openDt}</td>
				            <td>${Number(data.audiAcc).toLocaleString()}명</td>
				            <td>${Number(data.salesAcc).toLocaleString()}원</td>
				        </tr>
						`).join("")
					)
				}, 
				error: ()=>{
					console.log("ajax error");
				}
			})
		}
		
		const today=getDate();
		console.log("요청 날짜: ", today);
		getJSON(today);
	})
</script>

</html>
