<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Document</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/style.css}" />
</head>

<body>
	<nav class="navbar navbar-expand-sm bg-body-tertiary">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">SpringBoot Study</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link" th:href="@{/question/list}">질문 목록</a>
					</li>

					<li class="nav-item">
						<a class="nav-link" th:href="@{/boxoffice}">영화 박스 오피스</a>
					</li>

					<li class="nav-item" sec:authorize="isAnonymous()">
						<a class="nav-link" th:href="@{/user/login}">로그인</a>
					</li>

					<li class="nav-item d-flex" sec:authorize="isAuthenticated()">
						<img th:src="@{${profileImage} ?: '/images/user/default-profile.png'}" alt="prifle image" class="rounded-circle" width="60" height="60" />
						<a class="nav-link" th:href="@{/user/logout}">로그아웃</a>
					</li>

					<li class="nav-item" sec:authorize="isAnonymous()">
						<a class="nav-link" th:href="@{/user/signup}">회원가입</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<th:block layout:fragment="content"></th:block>

	<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

	<th:block layout:fragment="script"></th:block>
</body>

</html>
